# environment.yml
# Conda environment for training OpenEMMApro locally. Consolidates the
# Kaggle notebook's requirements.txt + ad-hoc pip cells into one spec.
#
# PyTorch is deliberately NOT pinned here: the right CUDA build depends on
# your GPU driver, not on this project. setup_local.sh installs it
# separately with `--index-url https://download.pytorch.org/whl/$CUDA_TAG`
# right after this env is created -- see config/local.env.example for
# CUDA_TAG. nuscenes-devkit and the vendored policy_heads package are also
# installed by setup_local.sh in their own steps, not listed below -- see
# docs/LOCAL_SETUP.md ("Why two install stages") for why. numpy/scikit-learn/
# scipy/parameterized/pycocotools/Shapely below are nuscenes-devkit's OWN
# declared dependencies (it's installed --no-deps, so they have to be
# satisfied here instead) -- see docs/LOCAL_SETUP.md's troubleshooting
# section for what broke the first time this list didn't include them.
name: openemma
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- Core OpenEMMA deps (requirements.txt) -----------------------
      - accelerate
      - matplotlib
      # opencv-python-headless, not opencv-python: this project never
      # opens a GUI window (cv2 calls here are circle/fillPoly/imwrite/
      # VideoWriter only), and -headless avoids needing libGL.so.1 /
      # other X11 shared libraries that a minimal/headless Linux training
      # box often doesn't have installed.
      - opencv-python-headless==4.11.0.86
      - Pillow
      - PyYAML
      - requests
      - tqdm
      - gdown
      - flask
      - Werkzeug
      - transformers==4.51.3
      - ultralytics
      - qwen_vl_utils
      - pyquaternion
      - pandas
      - seaborn
      - thop

      # --- Diffusion policy head (policy_heads / Tiny-VLA) -------------
      - peft==0.11.1
      # The Kaggle notebook originally pinned diffusers==0.27.2, but that
      # version imports huggingface_hub.cached_download -- removed in
      # huggingface_hub 0.26.0 -- while transformers==4.51.3 (above)
      # requires huggingface-hub>=0.30.0. Those two pins are mutually
      # exclusive: there's no huggingface_hub version that satisfies both
      # a diffusers<0.29 install and transformers' own floor. diffusers
      # dropped its use of cached_download in 0.29.0, so bumping to that
      # (verified: no cached_download references in its wheel, and its
      # DDIMScheduler.__init__ still accepts every kwarg build_model.py
      # passes -- num_train_timesteps/beta_schedule/clip_sample/
      # clip_sample_range/set_alpha_to_one/prediction_type, all unchanged)
      # resolves cleanly against transformers 4.51.3 with no further pin
      # needed on huggingface_hub at all.
      - diffusers==0.29.0
      - einops
      - einops-exts
      - bitsandbytes>=0.43

      # --- nuscenes-devkit's OWN deps (it is installed --no-deps in
      #     setup_local.sh, so its real dependency list has to be
      #     satisfied here instead -- taken directly from its PyPI
      #     metadata) -----------------------------------------------
      - cachetools
      - descartes
      - fire
      - scikit-learn
      - scipy
      - parameterized
      - pycocotools>=2.0.1
      - Shapely~=2.0.3
      - numpy<2.0.0,>=1.22.0

      # --- Downloading/assembling weights + dataset (scripts/*.py) -----
      # (huggingface_hub itself is already pinned above, for diffusers'
      # sake -- snapshot_download() has existed since well before 0.25.2,
      # so scripts/download_qwen_weights.py doesn't need anything newer.)
      - kaggle
